# A copy of Preciselyco/buildpipeline's go-library-release.yml. This
# repository is public and buildpipeline is private, and a public repository
# can't call a private repository's reusable workflow. Keep the two in step.
#
# Tags and releases a Go library on every push to its default branch: the
# next patch version after the highest vX.Y.Z tag, or initial-version when
# there is none. Services then require real versions instead of
# v0.0.0-<date>-<hash> pseudo-versions, and Renovate offers them ordinary
# version bumps instead of commit-hash ("digest") updates.
#
# A minor or major release is still a tag pushed by hand; the next merge
# continues from it. A commit that already carries a v* tag is left alone, so
# re-running the workflow is safe.
name: Go library release

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for this job, matching the other workflows here.
        type: string
        required: false
        default: ubuntu-latest
      initial-version:
        description: >-
          The tag to create when the repository has no vX.Y.Z tag yet. It must
          sort above the pseudo-versions consumers already require, which
          v0.1.0 does for v0.0.0-… ones.
        type: string
        required: false
        default: v0.1.0
    outputs:
      tag:
        description: The tag this run created, empty when it created none.
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    # Creating the tag and the release needs write access, and nothing else.
    permissions:
      contents: write
    # Two quick merges must not both compute the same next version. Queued, not
    # cancelled: the second run starts after the first has tagged, and checks
    # out with that tag present.
    concurrency:
      group: go-library-release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag is created through the API below, so git needs no
          # credentials after the checkout.
          persist-credentials: false
          # The next version comes from the existing tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the next version
        id: next
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are cut from $DEFAULT_BRANCH only, not $REF."
            exit 1
          fi
          if existing=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1) && [ -n "$existing" ]; then
            echo "HEAD is already $existing; nothing to release."
            exit 0
          fi
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname \
                   | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$latest" ]; then
            if ! printf '%s' "$INITIAL_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::initial-version must look like v1.2.3, not '$INITIAL_VERSION'."
              exit 1
            fi
            next=$INITIAL_VERSION
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "Releasing $next (previous: ${latest:-none})."
          {
            echo "tag=$next"
            echo "previous=$latest"
            echo "sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"

      # gh creates the tag on the commit together with the release. The notes
      # list the pull requests merged since the previous tag.
      - name: Tag and release
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.next.outputs.tag }}
          PREVIOUS: ${{ steps.next.outputs.previous }}
          SHA: ${{ steps.next.outputs.sha }}
        run: |
          set -euo pipefail
          args=(--target "$SHA" --title "$TAG" --generate-notes)
          if [ -n "$PREVIOUS" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$TAG" "${args[@]}"

      # A public module shows up on proxy.golang.org on first request, so ask
      # for it now rather than leaving the first consumer to wait. Private
      # modules never reach the proxy. A failure here doesn't undo the release.
      - name: Announce to the Go module proxy
        if: steps.next.outputs.tag != '' && !github.event.repository.private
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -uo pipefail
          module=$(awk '/^module /{print $2; exit}' go.mod)
          # The proxy spells each upper-case letter as ! and its lower case.
          escaped=$(printf '%s' "$module" | sed -E 's/([A-Z])/!\L\1/g')
          if ! curl -fsS "https://proxy.golang.org/$escaped/@v/$TAG.info"; then
            echo "::warning::proxy.golang.org did not return $module@$TAG yet."
          fi
