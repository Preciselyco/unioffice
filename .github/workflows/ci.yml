name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        # cmd/ uses kong's non-standard struct tag syntax which go vet rejects
        run: go vet $(go list ./... | grep -v '/cmd/')

      - name: Test
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          args: --timeout=5m

  # Once the tests pass on master, tag and release the next patch version
  # (buildpipeline's go-library-release.yml), so services require real
  # versions and Renovate offers version bumps instead of commit-hash updates.
  release:
    needs: [test, lint]
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: Preciselyco/buildpipeline/.github/workflows/go-library-release.yml@main
